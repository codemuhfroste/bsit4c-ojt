<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="A checklist with completed requirements and a progress ring">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf0fb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04112e" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- soft backdrop shapes -->
  <circle cx="290" cy="220" r="190" fill="#ffffff" fill-opacity=".05"/>
  <circle cx="290" cy="220" r="140" fill="#ffffff" fill-opacity=".06"/>
  <circle cx="60" cy="90" r="6" fill="#f7a81b"/>
  <circle cx="470" cy="360" r="8" fill="#f7a81b" fill-opacity=".8"/>
  <circle cx="486" cy="70" r="4" fill="#fff" fill-opacity=".6"/>
  <circle cx="34" cy="330" r="5" fill="#fff" fill-opacity=".5"/>
  <path d="M440 120l8 0M444 116l0 8" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- main checklist card -->
  <g filter="url(#sh)">
    <rect x="86" y="62" width="320" height="316" rx="26" fill="url(#card)"/>
  </g>
  <rect x="116" y="92" width="120" height="14" rx="7" fill="#17458f"/>
  <rect x="116" y="114" width="80" height="9" rx="4.5" fill="#9fb0cc"/>

  <!-- row 1: approved -->
  <rect x="112" y="148" width="268" height="58" rx="14" fill="#fff" stroke="#dbe4f3"/>
  <circle cx="142" cy="177" r="14" fill="#15803d"/>
  <path d="M135.5 177.5l4.5 4.5 8-9" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="168" y="167" width="120" height="10" rx="5" fill="#17458f" fill-opacity=".85"/>
  <rect x="168" y="184" width="76" height="8" rx="4" fill="#b9c6dd"/>
  <rect x="318" y="168" width="48" height="20" rx="10" fill="#dcfce7"/>
  <rect x="328" y="175" width="28" height="6" rx="3" fill="#15803d"/>

  <!-- row 2: in review -->
  <rect x="112" y="218" width="268" height="58" rx="14" fill="#fff" stroke="#dbe4f3"/>
  <circle cx="142" cy="247" r="14" fill="#fef3c7"/>
  <circle cx="142" cy="247" r="8.5" fill="none" stroke="#b45309" stroke-width="2.6"/>
  <path d="M142 242v5.5l3.5 2" fill="none" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="168" y="237" width="100" height="10" rx="5" fill="#17458f" fill-opacity=".85"/>
  <rect x="168" y="254" width="92" height="8" rx="4" fill="#b9c6dd"/>
  <rect x="318" y="238" width="48" height="20" rx="10" fill="#fef3c7"/>
  <rect x="328" y="245" width="28" height="6" rx="3" fill="#b45309"/>

  <!-- row 3: to do -->
  <rect x="112" y="288" width="268" height="58" rx="14" fill="#fff" stroke="#dbe4f3"/>
  <circle cx="142" cy="317" r="13" fill="none" stroke="#9fb0cc" stroke-width="2.6" stroke-dasharray="4 4"/>
  <rect x="168" y="307" width="112" height="10" rx="5" fill="#17458f" fill-opacity=".85"/>
  <rect x="168" y="324" width="64" height="8" rx="4" fill="#b9c6dd"/>
  <rect x="318" y="308" width="48" height="20" rx="10" fill="#e7eefb"/>
  <rect x="328" y="315" width="28" height="6" rx="3" fill="#17458f" fill-opacity=".7"/>

  <!-- progress ring card -->
  <g filter="url(#sh)">
    <rect x="344" y="28" width="132" height="132" rx="24" fill="#fff"/>
  </g>
  <circle cx="410" cy="94" r="40" fill="none" stroke="#e3e9f5" stroke-width="12"/>
  <circle cx="410" cy="94" r="40" fill="none" stroke="#f7a81b" stroke-width="12" stroke-linecap="round" stroke-dasharray="188 251" transform="rotate(-90 410 94)"/>
  <text x="410" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#17458f">75%</text>

  <!-- floating document -->
  <g filter="url(#sh)">
    <path d="M38 252a14 14 0 0 1 14-14h58l30 30v94a14 14 0 0 1-14 14H52a14 14 0 0 1-14-14z" fill="#fff"/>
  </g>
  <path d="M110 238l30 30h-18a12 12 0 0 1-12-12z" fill="#dbe4f3"/>
  <rect x="58" y="284" width="64" height="8" rx="4" fill="#b9c6dd"/>
  <rect x="58" y="302" width="48" height="8" rx="4" fill="#b9c6dd"/>
  <rect x="56" y="326" width="42" height="20" rx="6" fill="#17458f"/>
  <text x="77" y="340.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">PDF</text>

  <!-- upload badge -->
  <g filter="url(#sh)">
    <circle cx="388" cy="372" r="30" fill="#f7a81b"/>
  </g>
  <path d="M388 384v-22M378 371l10-10 10 10" fill="none" stroke="#0f2a5c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
