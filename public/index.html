<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSIT 4C OJT Checklist</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#5f6670; --border:#d5d9df; --accent:#2455d6; --err:#b42318; --ok:#067647; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161a; --card:#1d2026; --text:#eceef2; --muted:#9aa1ad; --border:#363b44; --accent:#6c93ff; --err:#ff8a80; --ok:#5fd29b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
    main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; }
    h1 { margin:0 0 4px; font-size:1.25rem; }
    p.sub { margin:0 0 20px; color:var(--muted); font-size:.9rem; }
    label { display:block; margin-bottom:14px; font-size:.9rem; }
    input { display:block; width:100%; margin-top:4px; padding:10px; font:inherit; color:inherit; background:transparent; border:1px solid var(--border); border-radius:8px; }
    input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    button { width:100%; padding:10px; font:inherit; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    #msg { min-height:1.5em; margin:12px 0 0; font-size:.9rem; }
    #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  </style>
</head>
<body>
  <main>
    <h1>BSIT 4C OJT Checklist</h1>
    <p class="sub">Register your email and password to get started.</p>
    <form id="form" novalidate>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      </label>
      <label>Confirm password
        <input id="confirm" type="password" autocomplete="new-password" required>
      </label>
      <button id="submit" type="submit">Register</button>
      <p id="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    const show = (text, kind) => { msg.textContent = text; msg.className = kind; };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;
      if (password !== form.confirm.value) return show("Passwords do not match.", "err");

      submit.disabled = true;
      show("", "");
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { form.reset(); show("Registered! You are all set.", "ok"); }
        else show(data.error || "Registration failed.", "err");
      } catch {
        show("Network error. Try again.", "err");
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
